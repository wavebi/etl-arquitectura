version: 2

models:
  - name: stg_frankfurter__cotizaciones
    description: >
      Cotizaciones tipadas y renombradas al español. Grano: una fila por fecha,
      moneda base y moneda cotizada. Descarta cotizaciones <= 0 (datos corruptos del
      origen).
    columns:
      - name: fecha
        data_tests: [not_null]
      - name: moneda_base
        data_tests: [not_null]
      - name: moneda_cotizada
        data_tests: [not_null]
      - name: cotizacion
        description: "Unidades de la moneda cotizada por cada unidad de la base."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [fecha, moneda_base, moneda_cotizada]
          config:
            severity: error

  - name: stg_frankfurter__monedas
    description: "Monedas que el origen publica hoy. Grano: una moneda."
    columns:
      - name: codigo_moneda
        description: "Código ISO 4217 de la moneda."
        data_tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 3
      - name: nombre_moneda
        data_tests:
          - not_null:
              config:
                severity: error
