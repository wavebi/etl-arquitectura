name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PAT (no GITHUB_TOKEN) para que el tag que crea dispare el workflow de deploy.
          token: ${{ secrets.GH_PAT_RELEASE }}
