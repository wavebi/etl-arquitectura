name: Lint Commit Message

# Solo en PR: a `dev` y `main` no se puede pushear directo (ver las reglas de rama),
# y validar cada push a una rama de trabajo es ruido — lo que importa es que el
# historial que entra a `dev` sea semántico.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Commits
        uses: wagoid/commitlint-github-action@v6.2.1
      - name: Validate PR Title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
